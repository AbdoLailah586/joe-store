  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <main id="store-loading" dir="rtl" aria-label="جاري تحميل المتجر" style="min-height:100vh;padding:24px;max-width:1280px;margin:0 auto;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
          <h1 style="color:#b45309;font-size:20px;margin:0">JOE Store | جو ستور</h1>
          <span id="store-loading-message" style="font-size:13px;color:#475569">جاري تحميل المنتجات…</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px">
          <div style="height:310px;border-radius:18px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%)"></div>
          <div style="height:310px;border-radius:18px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%)"></div>
          <div style="height:310px;border-radius:18px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%)"></div>
          <div style="height:310px;border-radius:18px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%)"></div>
        </div>
        <div style="margin-top:20px;text-align:center">
          <button id="store-retry" type="button" hidden style="padding:12px 24px;border:0;border-radius:12px;background:#fbbf24;font-weight:bold;cursor:pointer">إعادة المحاولة</button>
        </div>
        <noscript>فعّل JavaScript في المتصفح لفتح المتجر.</noscript>
      </main>
    </div>
    <script>
      (function () {
        function showRetry() {
          var message = document.getElementById('store-loading-message');
          var retry = document.getElementById('store-retry');
          if (message && retry) {
            message.textContent = 'تعذّر تحميل المتجر. تحقق من الاتصال وأعد المحاولة.';
            retry.hidden = false;
          }
        }
        document.getElementById('store-retry').addEventListener('click', function () {
          window.location.reload();
        });
        window.addEventListener('error', showRetry, true);
        window.addEventListener('unhandledrejection', showRetry);
        window.setTimeout(showRetry, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
