<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#080C14" />
    <meta name="description" content="JOE Store - متجر جو ستور لأحدث الهواتف الذكية، إكسسوارات الموبايل، الساعات الذكية، الشواحن والسماعات الأصلية بأفضل الأسعار وأقوى ضمان." />
    
    <!-- Google Fonts: Cairo for Arabic, Outfit for English & Numerals -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>JOE Store | جو ستور - الهواتف والإكسسوارات الأصلية</title>
    <!-- Google Identity Services for Google OAuth Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#080C14] text-slate-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <main id="store-loading" dir="rtl" style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;font-family:Arial,sans-serif;background:#080C14;color:#f1f5f9">
        <h1 style="color:#fbbf24">JOE Store | جو ستور</h1>
        <p id="store-loading-message">جاري تحميل المتجر…</p>
        <button id="store-retry" type="button" hidden style="padding:12px 24px;border:0;border-radius:12px;background:#fbbf24;font-weight:bold;cursor:pointer">إعادة المحاولة</button>
        <noscript>فعّل JavaScript في المتصفح لفتح المتجر.</noscript>
      </main>
    </div>
    <script>
      (function () {
        function showRetry() {
          var message = document.getElementById('store-loading-message');
          var retry = document.getElementById('store-retry');
          if (message && retry) {
            message.textContent = 'تعذّر تحميل المتجر. تحقق من الاتصال وأعد المحاولة.';
            retry.hidden = false;
          }
        }
        document.getElementById('store-retry').addEventListener('click', function () {
          window.location.reload();
        });
        window.addEventListener('error', showRetry, true);
        window.addEventListener('unhandledrejection', showRetry);
        window.setTimeout(showRetry, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
